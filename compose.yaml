name: elilap-dev-agent

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: elilap-dev-agent:local
    # .env is the same file a host run loads; it is not baked into the image.
    # Optional so `docker compose config`/one-shot stats work before setup.
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_DB_PATH: /data/index.db
      AGENT_A2A_TOKENS_FILE: /data/a2a-tokens.txt
      # The host publishes 8081 -> container 8080, and --bind-public requires
      # this absolute URL in the agent card. Override it if the host differs.
      AGENT_A2A_PUBLIC_URL: ${AGENT_A2A_PUBLIC_URL:-http://127.0.0.1:8081}
    command: ["agent", "serve", "--bind-public", "--addr", "0.0.0.0:8080"]
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      # Runtime data (index, WAL/SHM, backups, token file, budget counters) stays
      # on the host. Long syntax + create_host_path: false makes a missing ./data
      # fail clearly instead of Compose creating a root-owned directory.
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
    # The bind is public but published on loopback only, and it is token-less by
    # default: answers are bounded by the spend budget, so the container runs
    # with the default quotas (3/min per identity, 20/day per identity, 20/day
    # per address, 60/day global) and writes ./data/quota.json. Add quotas to
    # the command to tighten them, or issue a token to gate every request:
    #   docker compose run --rm agent agent tokens add --id local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
