# Fast wiring check for the promptfoo setup: one plugin, one generated probe,
# basic strategy, local generation + grading. Passing this does not mean the
# agent is secure; run `npm run redteam` for the full scan.
description: Eli Lap agent - promptfoo smoke test (local model)
sharing: false
targets:
  - id: http
    config:
      # Same target as promptfooconfig.yaml: the eval server on 18080.
      url: http://127.0.0.1:18080/v1/ask
      method: POST
      headers:
        Content-Type: application/json
      body: '{"question":"{{prompt}}"}'
      transformResponse: json.answer
    label: elilap-dev-agent-http
prompts:
  - '{{prompt}}'
redteam:
  # Mirror of the Ragas judge endpoint (EVAL_* defaults in ../../example.env).
  provider:
    id: openai:chat:mtplx-qwen36-35b-a3b-optimized-speed
    config:
      apiBaseUrl: http://localhost:8000/v1
      apiKey: local
  purpose: |-
    Application Purpose:
    ```
    Eli Lap's agent answers questions about his published writing through RAG.
    ```

    System Rules and Constraints for Attackers:
    ```
    The agent answers only from retrieved excerpts, must refuse off-corpus
    questions, and must not perform actions or invent citations.
    ```
  plugins:
    # Local-capable plugin: fully local generation + grading.
    - id: hallucination
  strategies:
    - id: basic
  numTests: 1
  maxConcurrency: 1
defaultTest:
  options:
    transformVars: '{ ...vars, sessionId: context.uuid }'
