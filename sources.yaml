# sources.yaml - static import configuration.
#
# Declares which providers exist and how they are configured. Secrets are
# never stored here: every credential names an environment variable to read
# at runtime. See PLAN.md §2.6 and docs/sources-config.md.
#
# Validate with: ./agent sources validate

version: 1

defaults:
  chunking: { target_tokens: 400, overlap_tokens: 60 }
  user_agent: "elilap-dev-agent/0.1 (+https://elilap.dev)"

sources:
  - id: ghost
    type: ghost
    enabled: true
    credentials:
      api_url: { env: GHOST_API_URL }
      api_key: { env: GHOST_API_KEY }
    options: { include_drafts: false, limit: 500 }

  - id: postiz
    type: postiz
    enabled: true
    credentials:
      api_url: { env: POSTIZ_API_URL }
      api_key: { env: POSTIZ_API_KEY }
    options: { platforms: [linkedin], include_scheduled: false }

  # The public site (Astro) - the pages that are not Ghost posts: services,
  # case studies, project and AI pages. No credentials: it is a public site,
  # so its URL is configuration, not a secret. The Ghost source above owns
  # read.elilap.dev posts, so /blog (a listing page that links there) and
  # /tag/* are excluded rather than indexed twice.
  #
  # strategy: elilap selects the host adapter in internal/sources/web. Use
  # `agent sources inspect --source website --url <page>` to re-derive the
  # extraction whenever the layout changes.
  - id: website
    type: web
    enabled: true
    options:
      site_url: https://elilap.dev
      sitemap: true
      feeds: false
      strategy: elilap
      author: "Eli Lap"
      max_pages: 100
      include_paths:
        - "^/$"
        - "^/ai(/|$)"
        - "^/case-study/"
        - "^/cases$"
        - "^/connect$"
        - "^/contact$"
        - "^/projects$"
        - "^/services$"
      exclude_paths:
        - "^/blog$"
        - "^/tag/"
        - "^/privacy$"
