version: 1
# Answer gold set for the Ragas harness (evals/evaluate.py).
#
# Each case is a question a peer would plausibly ask this agent, the chunk a
# human verified as the evidence, and the facts a correct grounded answer has
# to state. `must_mention` holds only headline facts — a proper noun, a model
# id, a number — never phrasing, so a correct answer worded differently still
# passes.
#
# evaluate.py turns this into a Ragas dataset: `query` -> question,
# `must_mention` -> grading notes for the correctness metric, and
# `expect_chunk_ids` stays for traceability.
#
#   cd evals && uv run python evaluate.py --kind answers
#
# This needs the chat endpoint up; check it first with
# `cd evals && uv run python test_llm.py` or a single `./agent ask`.
queries:
  - id: ans-agent-vms
    kind: answer
    query: What do the OpenClaw and Hermes setups run on?
    expect_chunk_ids:
      - 888a0fbe3faf82658ef313b8fd3825a6a135f17f137820ea0f2e46449299a027
      - c5851de10c21299c0b033fc02be6bc50c6495c85ab05ed1a5af879f9226cd230
      # The same claim cross-posted to LinkedIn. A correct answer may cite the
      # social copy instead of the post; both state the fact verbatim.
      - 67fbdceb8833e86e1bbd9a070392e5a5beb12f5a2954b1a0ff41a5fd471786b0
    must_mention: [Proxmox, Hermes]
    note: Two VMs on a Proxmox host; OpenClaw and Hermes are the two setups.

  - id: ans-local-hardware
    kind: answer
    query: How much RAM does his local model machine have and which models does he run?
    expect_chunk_ids:
